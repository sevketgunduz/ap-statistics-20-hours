<svg viewBox="0 0 720 396" xmlns="http://www.w3.org/2000/svg" role="img" color="#15201f" aria-label="Decision tree: a variable is categorical if its values name a group, otherwise quantitative, and then discrete if counted or continuous if measured" font-family="Public Sans, system-ui, sans-serif" fill="none" stroke="currentColor">
<rect x="300" y="16" width="120" height="38" rx="4" stroke="currentColor" stroke-width="1.4" opacity="0.5" fill="none"/>
<text x="360" y="40" font-size="14" font-weight="600" text-anchor="middle" fill="currentColor" stroke="none">A variable</text>
<line x1="360" y1="54" x2="360" y2="70" stroke="currentColor" stroke-width="1.4" opacity="0.5"/>
<line x1="160" y1="70" x2="556" y2="70" stroke="currentColor" stroke-width="1.4" opacity="0.5"/>
<line x1="160" y1="70" x2="160" y2="106" stroke="currentColor" stroke-width="1.4" opacity="0.5"/>
<polygon points="160.0,113.0 156.2,104.0 163.8,104.0" fill="currentColor" stroke="none"/>
<line x1="556" y1="70" x2="556" y2="106" stroke="currentColor" stroke-width="1.4" opacity="0.5"/>
<polygon points="556.0,113.0 552.2,104.0 559.8,104.0" fill="currentColor" stroke="none"/>
<text x="160" y="90" font-size="12" font-weight="500" text-anchor="middle" fill="currentColor" stroke="none" opacity="0.75">names a group</text>
<text x="556" y="90" font-size="12" font-weight="500" text-anchor="middle" fill="currentColor" stroke="none" opacity="0.75">has units of measure</text>
<rect x="48" y="120" width="224" height="66" rx="4" stroke="currentColor" stroke-width="1.4" opacity="0.5" fill="none"/>
<text x="60" y="144" font-size="11.5" font-weight="600" text-anchor="start" fill="#1a6b63" stroke="none" font-family="IBM Plex Mono, monospace">CATEGORICAL</text>
<text x="60" y="166" font-size="13" font-weight="400" text-anchor="start" fill="currentColor" stroke="none" opacity="0.78">values are group labels</text>
<text x="60" y="206" font-size="12.5" font-weight="400" text-anchor="start" fill="currentColor" stroke="none" opacity="0.62">travel mode &#183; hospital &#183; yes / no</text>
<rect x="48" y="222" width="224" height="98" rx="4" stroke="#1a6b63" stroke-width="1.4" opacity="0.45" fill="none"/>
<text x="62" y="246" font-size="11" font-weight="600" text-anchor="start" fill="#1a6b63" stroke="none" font-family="IBM Plex Mono, monospace">THE DIGITS TEST</text>
<text x="62" y="269" font-size="12.5" font-weight="400" text-anchor="start" fill="currentColor" stroke="none" opacity="0.78">Written with digits but has</text>
<text x="62" y="287" font-size="12.5" font-weight="400" text-anchor="start" fill="currentColor" stroke="none" opacity="0.78">no units? Still categorical:</text>
<text x="62" y="308" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" stroke="none" opacity="0.62">ZIP code &#183; room no. &#183; shirt no.</text>
<rect x="444" y="120" width="224" height="66" rx="4" stroke="currentColor" stroke-width="1.4" opacity="0.5" fill="none"/>
<text x="456" y="144" font-size="11.5" font-weight="600" text-anchor="start" fill="#1a6b63" stroke="none" font-family="IBM Plex Mono, monospace">QUANTITATIVE</text>
<text x="456" y="166" font-size="13" font-weight="400" text-anchor="start" fill="currentColor" stroke="none" opacity="0.78">numbers with units</text>
<line x1="556" y1="186" x2="556" y2="212" stroke="currentColor" stroke-width="1.4" opacity="0.5"/>
<text x="556" y="230" font-size="12.5" font-weight="500" text-anchor="middle" fill="currentColor" stroke="none" opacity="0.75">counted, or measured?</text>
<line x1="556" y1="240" x2="556" y2="258" stroke="currentColor" stroke-width="1.4" opacity="0.5"/>
<line x1="452" y1="258" x2="640" y2="258" stroke="currentColor" stroke-width="1.4" opacity="0.5"/>
<line x1="452" y1="258" x2="452" y2="280" stroke="currentColor" stroke-width="1.4" opacity="0.5"/>
<polygon points="452.0,287.0 448.2,278.0 455.8,278.0" fill="currentColor" stroke="none"/>
<line x1="640" y1="258" x2="640" y2="280" stroke="currentColor" stroke-width="1.4" opacity="0.5"/>
<polygon points="640.0,287.0 636.2,278.0 643.8,278.0" fill="currentColor" stroke="none"/>
<rect x="366" y="294" width="172" height="60" rx="4" stroke="currentColor" stroke-width="1.4" opacity="0.5" fill="none"/>
<text x="378" y="317" font-size="11.5" font-weight="600" text-anchor="start" fill="#1a6b63" stroke="none" font-family="IBM Plex Mono, monospace">DISCRETE</text>
<text x="378" y="338" font-size="12.5" font-weight="400" text-anchor="start" fill="currentColor" stroke="none" opacity="0.78">you count it</text>
<text x="378" y="375" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" stroke="none" opacity="0.62">0, 1, 2 vehicles</text>
<rect x="556" y="294" width="150" height="60" rx="4" stroke="currentColor" stroke-width="1.4" opacity="0.5" fill="none"/>
<text x="568" y="317" font-size="11.5" font-weight="600" text-anchor="start" fill="#1a6b63" stroke="none" font-family="IBM Plex Mono, monospace">CONTINUOUS</text>
<text x="568" y="338" font-size="12.5" font-weight="400" text-anchor="start" fill="currentColor" stroke="none" opacity="0.78">you measure it</text>
<text x="568" y="375" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" stroke="none" opacity="0.62">24.6 minutes</text>
</svg>
