<svg viewBox="0 0 760 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="St Mary&#x27;s records, 400 randomly selected outpatients. How the appointment was booked is associated with signing up for text reminders (70.0% of self-booked patients signed up, 10.0% of hospital-booked) and with missing the appointment (5.0% of self-booked missed, 25.0% of hospital-booked). Between signing up and missing the association is 7.5% against 20.0%, but the records cannot say whether reminders caused it." font-family="Public Sans, system-ui, sans-serif">
