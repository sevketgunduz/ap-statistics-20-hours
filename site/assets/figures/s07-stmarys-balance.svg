<text class="ink3" x="538.6" y="280.0" font-size="11" font-weight="400" text-anchor="middle" fill="#6f7b79">80%</text>
<line class="axis" x1="634.3" y1="262.0" x2="634.3" y2="266.0" stroke="#c3c9c6" stroke-width="1.2" fill="none"/>
<text class="ink3" x="634.3" y="280.0" font-size="11" font-weight="400" text-anchor="middle" fill="#6f7b79">90%</text>
<line class="axis" x1="730.0" y1="262.0" x2="730.0" y2="266.0" stroke="#c3c9c6" stroke-width="1.2" fill="none"/>
<text class="ink3" x="730.0" y="280.0" font-size="11" font-weight="400" text-anchor="middle" fill="#6f7b79">100%</text>
<text class="ink3" x="395.0" y="302.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#6f7b79">percentage of the text-reminder group who self-booked their appointment</text>
<text class="ink3" x="20.0" y="24.0" font-size="11" font-weight="400" text-anchor="start" fill="#6f7b79">number of the 1,000 random assignments</text>
<text class="ink" x="293.4" y="58.0" font-size="12" font-weight="600" text-anchor="start" fill="#15201f">completely randomized: 44.5% to 55.0%</text>
<text class="ink2" x="293.4" y="74.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#4a5654">block design: exactly 50% every time</text>
