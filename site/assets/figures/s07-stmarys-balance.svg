  .kink2 { stroke: #4a5654; }
  .kink3 { stroke: #6f7b79; }
  .axis { stroke: #c3c9c6; }
  .grid { stroke: #dcdfdd; }
  .surf { fill: #ffffff; }
  .band { fill: #eef1ef; }
  .acc { fill: #1a6b63; }
  .kacc { stroke: #1a6b63; }
  .amb { fill: #7d5a11; }
  .kamb { stroke: #7d5a11; }
  .s0 { fill: #2a78d6; }
  .k0 { stroke: #2a78d6; }
  .s1 { fill: #eb6834; }
  .k1 { stroke: #eb6834; }
  .s2 { fill: #1baf7a; }
  .k2 { stroke: #1baf7a; }
  .s3 { fill: #eda100; }
  .k3 { stroke: #eda100; }
  .s4 { fill: #e87ba4; }
  .k4 { stroke: #e87ba4; }
  .s5 { fill: #008300; }
  .k5 { stroke: #008300; }
  @media (prefers-color-scheme: dark) {
    .ink { fill: #e9edeb; }
    .ink2 { fill: #a5b0ad; }
    .ink3 { fill: #7e8a87; }
    .kink { stroke: #e9edeb; }
    .kink2 { stroke: #a5b0ad; }
    .kink3 { stroke: #7e8a87; }
    .axis { stroke: #3a4644; }
    .grid { stroke: #2a3533; }
    .surf { fill: #182120; }
    .band { fill: #1e2827; }
    .acc { fill: #54b8ab; }
    .kacc { stroke: #54b8ab; }
    .amb { fill: #d9ab52; }
    .kamb { stroke: #d9ab52; }
    .s0 { fill: #3987e5; }
    .k0 { stroke: #3987e5; }
    .s1 { fill: #d95926; }
    .k1 { stroke: #d95926; }
    .s2 { fill: #199e70; }
    .k2 { stroke: #199e70; }
    .s3 { fill: #c98500; }
