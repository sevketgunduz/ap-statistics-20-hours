<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Histogram of the percentage of the text-reminder group who self-booked, in 1,000 random assignments of 800 patients (400 self-booked) to two groups of 400. The percentages cluster tightly around 50%, from 44.5% to 55.0%. A randomized block design gives exactly 50% every time. When patients chose for themselves, in the Session 6 records, 87.5% of those who signed up for reminders had self-booked." font-family="Public Sans, system-ui, sans-serif">
<style>
  .ink { fill: #15201f; }
  .ink2 { fill: #4a5654; }
  .ink3 { fill: #6f7b79; }
