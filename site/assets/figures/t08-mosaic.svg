<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mosaic plot of pet ownership by housing type" font-family="Public Sans, system-ui, sans-serif">
<style>
  .ink { fill: #15201f; } .ink2 { fill: #4a5654; } .ink3 { fill: #6f7b79; }
  .axis { stroke: #c3c9c6; } .grid { stroke: #dcdfdd; } .edge { stroke: #ffffff; }
  .s0 { fill: #2a78d6; } .s1 { fill: #eb6834; } .s2 { fill: #1baf7a; }
