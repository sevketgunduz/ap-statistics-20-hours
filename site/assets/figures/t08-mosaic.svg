    .ink { fill: #e9edeb; } .ink2 { fill: #a5b0ad; } .ink3 { fill: #7e8a87; }
    .axis { stroke: #3a4644; } .grid { stroke: #2a3533; } .edge { stroke: #182120; }
    .s0 { fill: #3987e5; } .s1 { fill: #d95926; } .s2 { fill: #199e70; }
  }
</style>
