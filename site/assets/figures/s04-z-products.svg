<svg viewBox="0 0 540 390" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The five students plotted as z-scores, with the product of z-scores for each" font-family="Public Sans, system-ui, sans-serif">
<style>
  .ink   { fill: #15201f; }
  .ink2  { fill: #4a5654; }
  .ink3  { fill: #6f7b79; }
  .axis  { stroke: #c3c9c6; }
  .grid  { stroke: #dcdfdd; }
  .gap   { stroke: #ffffff; }
  .surf  { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .ink  { fill: #e9edeb; }
    .ink2 { fill: #a5b0ad; }
    .ink3 { fill: #7e8a87; }
    .axis { stroke: #3a4644; }
    .grid { stroke: #2a3533; }
    .gap  { stroke: #182120; }
    .surf { fill: #182120; }
  }

  .s0 { fill: #2a78d6; }
  .k0 { stroke: #2a78d6; }
  .s1 { fill: #eb6834; }
  .k1 { stroke: #eb6834; }
  @media (prefers-color-scheme: dark) {
    .s0 { fill: #3987e5; }
    .k0 { stroke: #3987e5; }
    .s1 { fill: #d95926; }
    .k1 { stroke: #d95926; }
  }
</style>
