<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="St Mary&#x27;s reminder experiment as a randomized block design. 800 of next month&#x27;s outpatients are grouped by how the appointment was booked: 400 self-booked online and 400 booked by the hospital. Within each block a random number generator assigns 200 patients to a text reminder the day before and 200 to no text. Within each block, compare the proportion who miss the appointment." font-family="Public Sans, system-ui, sans-serif">
