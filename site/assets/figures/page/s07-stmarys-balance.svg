<rect class="s0" x="246.6" y="82.6" width="8.8" height="179.4" rx="0" fill="#2a78d6" stroke="none" stroke-width="0"/>
<rect class="s0" x="256.2" y="109.8" width="8.8" height="152.2" rx="0" fill="#2a78d6" stroke="none" stroke-width="0"/>
<rect class="s0" x="265.8" y="131.6" width="8.8" height="130.4" rx="0" fill="#2a78d6" stroke="none" stroke-width="0"/>
<rect class="s0" x="275.4" y="212.1" width="8.8" height="49.9" rx="0" fill="#2a78d6" stroke="none" stroke-width="0"/>
<rect class="s0" x="284.9" y="243.6" width="8.8" height="18.4" rx="0" fill="#2a78d6" stroke="none" stroke-width="0"/>
<rect class="s0" x="294.5" y="257.6" width="8.8" height="4.4" rx="0" fill="#2a78d6" stroke="none" stroke-width="0"/>
<line class="axis" x1="60.0" y1="262.0" x2="730.0" y2="262.0" stroke="#c3c9c6" stroke-width="1.2" fill="none"/>
<line class="axis" x1="60.0" y1="262.0" x2="60.0" y2="266.0" stroke="#c3c9c6" stroke-width="1.2" fill="none"/>
<text class="ink3" x="60.0" y="280.0" font-size="11" font-weight="400" text-anchor="middle" fill="#6f7b79">30%</text>
<line class="axis" x1="155.7" y1="262.0" x2="155.7" y2="266.0" stroke="#c3c9c6" stroke-width="1.2" fill="none"/>
<text class="ink3" x="155.7" y="280.0" font-size="11" font-weight="400" text-anchor="middle" fill="#6f7b79">40%</text>
<line class="axis" x1="251.4" y1="262.0" x2="251.4" y2="266.0" stroke="#c3c9c6" stroke-width="1.2" fill="none"/>
<text class="ink3" x="251.4" y="280.0" font-size="11" font-weight="400" text-anchor="middle" fill="#6f7b79">50%</text>
<line class="axis" x1="347.1" y1="262.0" x2="347.1" y2="266.0" stroke="#c3c9c6" stroke-width="1.2" fill="none"/>
<text class="ink3" x="347.1" y="280.0" font-size="11" font-weight="400" text-anchor="middle" fill="#6f7b79">60%</text>
<line class="axis" x1="442.9" y1="262.0" x2="442.9" y2="266.0" stroke="#c3c9c6" stroke-width="1.2" fill="none"/>
<text class="ink3" x="442.9" y="280.0" font-size="11" font-weight="400" text-anchor="middle" fill="#6f7b79">70%</text>
<line class="axis" x1="538.6" y1="262.0" x2="538.6" y2="266.0" stroke="#c3c9c6" stroke-width="1.2" fill="none"/>
<text class="ink3" x="538.6" y="280.0" font-size="11" font-weight="400" text-anchor="middle" fill="#6f7b79">80%</text>
<line class="axis" x1="634.3" y1="262.0" x2="634.3" y2="266.0" stroke="#c3c9c6" stroke-width="1.2" fill="none"/>
<text class="ink3" x="634.3" y="280.0" font-size="11" font-weight="400" text-anchor="middle" fill="#6f7b79">90%</text>
<line class="axis" x1="730.0" y1="262.0" x2="730.0" y2="266.0" stroke="#c3c9c6" stroke-width="1.2" fill="none"/>
<text class="ink3" x="730.0" y="280.0" font-size="11" font-weight="400" text-anchor="middle" fill="#6f7b79">100%</text>
<text class="ink3" x="395.0" y="302.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#6f7b79">percentage of the text-reminder group who self-booked their appointment</text>
<text class="ink3" x="20.0" y="24.0" font-size="11" font-weight="400" text-anchor="start" fill="#6f7b79">number of the 1,000 random assignments</text>
<text class="ink" x="293.4" y="58.0" font-size="12" font-weight="600" text-anchor="start" fill="#15201f">completely randomized: 44.5% to 55.0%</text>
<text class="ink2" x="293.4" y="74.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#4a5654">block design: exactly 50% every time</text>
<line class="kamb" x1="610.4" y1="100.0" x2="610.4" y2="262.0" stroke="#7d5a11" stroke-width="2.0" fill="none" stroke-dasharray="5 3"/>
<circle class="amb" cx="610.4" cy="262.0" r="5.0" fill="#7d5a11" stroke="none" stroke-width="1.2"/>
<text class="amb" x="604.4" y="114.0" font-size="11.5" font-weight="600" text-anchor="end" fill="#7d5a11">patients chose (Session 6 records):</text>
<text class="amb" x="604.4" y="130.0" font-size="11.5" font-weight="400" text-anchor="end" fill="#7d5a11">87.5% of those who signed up</text>
<text class="amb" x="604.4" y="146.0" font-size="11.5" font-weight="400" text-anchor="end" fill="#7d5a11">had self-booked</text>
</svg>
