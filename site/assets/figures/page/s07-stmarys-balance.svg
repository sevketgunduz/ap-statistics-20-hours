<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Histogram of the percentage of the text-reminder group who self-booked, in 1,000 random assignments of 800 patients (400 self-booked) to two groups of 400. The percentages cluster tightly around 50%, from 44.5% to 55.0%. A randomized block design gives exactly 50% every time. When patients chose for themselves, in the Session 6 records, 87.5% of those who signed up for reminders had self-booked." font-family="Public Sans, system-ui, sans-serif">
<style>
  .ink { fill: var(--ink, #15201f); }
  .ink2 { fill: var(--ink-2, #4a5654); }
  .ink3 { fill: var(--ink-3, #6f7b79); }
  .kink { stroke: var(--ink, #15201f); }
  .kink2 { stroke: var(--ink-2, #4a5654); }
  .kink3 { stroke: var(--ink-3, #6f7b79); }
  .axis { stroke: var(--rule-strong, #c3c9c6); }
  .grid { stroke: var(--rule, #dcdfdd); }
  .surf { fill: var(--surface, #ffffff); }
  .band { fill: var(--surface-2, #eef1ef); }
  .acc { fill: var(--accent, #1a6b63); }
  .kacc { stroke: var(--accent, #1a6b63); }
  .amb { fill: var(--amber, #7d5a11); }
  .kamb { stroke: var(--amber, #7d5a11); }
  .s0 { fill: var(--s1, #2a78d6); }
  .k0 { stroke: var(--s1, #2a78d6); }
  .s1 { fill: var(--s2, #eb6834); }
  .k1 { stroke: var(--s2, #eb6834); }
  .s2 { fill: var(--s3, #1baf7a); }
  .k2 { stroke: var(--s3, #1baf7a); }
  .s3 { fill: var(--s4, #eda100); }
  .k3 { stroke: var(--s4, #eda100); }
  .s4 { fill: var(--s5, #e87ba4); }
  .k4 { stroke: var(--s5, #e87ba4); }
  .s5 { fill: var(--s6, #008300); }
  .k5 { stroke: var(--s6, #008300); }
</style>
<line class="grid" x1="60.0" y1="262.0" x2="730.0" y2="262.0" stroke="#dcdfdd" stroke-width="1" fill="none"/>
<text class="ink3" x="52.0" y="266.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#6f7b79">0</text>
<line class="grid" x1="60.0" y1="174.5" x2="730.0" y2="174.5" stroke="#dcdfdd" stroke-width="1" fill="none"/>
<text class="ink3" x="52.0" y="178.5" font-size="10.5" font-weight="400" text-anchor="end" fill="#6f7b79">100</text>
<line class="grid" x1="60.0" y1="87.0" x2="730.0" y2="87.0" stroke="#dcdfdd" stroke-width="1" fill="none"/>
<text class="ink3" x="52.0" y="91.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#6f7b79">200</text>
<rect class="s0" x="198.8" y="257.6" width="8.8" height="4.4" rx="0" fill="#2a78d6" stroke="none" stroke-width="0"/>
<rect class="s0" x="208.4" y="244.5" width="8.8" height="17.5" rx="0" fill="#2a78d6" stroke="none" stroke-width="0"/>
