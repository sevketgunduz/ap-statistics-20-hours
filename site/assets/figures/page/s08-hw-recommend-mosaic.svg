<rect class="s1 ksurf" x="262.2" y="44.0" width="153.1" height="22.9" fill="#eb6834" stroke="#ffffff" stroke-width="1"/>
<text class="ink" x="338.7" y="310.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#15201f">Riverside</text>
<rect class="s0 ksurf" x="418.3" y="102.0" width="112.1" height="174.0" fill="#2a78d6" stroke="#ffffff" stroke-width="1"/>
<rect class="s1 ksurf" x="418.3" y="44.0" width="112.1" height="58.0" fill="#eb6834" stroke="#ffffff" stroke-width="1"/>
<text class="ink" x="474.4" y="294.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#15201f">Northgate</text>
<rect class="s0 ksurf" x="533.4" y="136.8" width="97.0" height="139.2" fill="#2a78d6" stroke="#ffffff" stroke-width="1"/>
<rect class="s1 ksurf" x="533.4" y="44.0" width="97.0" height="92.8" fill="#eb6834" stroke="#ffffff" stroke-width="1"/>
<text class="ink" x="582.0" y="310.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#15201f">Parkview</text>
<rect class="s0 ksurf" x="633.5" y="90.4" width="64.7" height="185.6" fill="#2a78d6" stroke="#ffffff" stroke-width="1"/>
<rect class="s1 ksurf" x="633.5" y="44.0" width="64.7" height="46.4" fill="#eb6834" stroke="#ffffff" stroke-width="1"/>
<text class="ink" x="665.8" y="294.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#15201f">Eastwood</text>
<rect class="s0 ksurf" x="701.2" y="160.0" width="38.8" height="116.0" fill="#2a78d6" stroke="#ffffff" stroke-width="1"/>
