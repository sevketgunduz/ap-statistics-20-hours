<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mosaic plot of hospital and whether the patient would recommend it, the 300 surveyed patients. Columns from left: St Mary&#x27;s, Riverside, Northgate, Parkview, Eastwood, Hillcrest, with widths proportional to 84, 71, 52, 45, 30 and 18 patients. The yes segment is lowest, and its height is the percentage of that hospital&#x27;s patients who would recommend it." font-family="Public Sans, system-ui, sans-serif">
<style>
  .ink { fill: var(--ink, #15201f); }
  .ink2 { fill: var(--ink-2, #4a5654); }
  .ink3 { fill: var(--ink-3, #6f7b79); }
  .surf { fill: var(--surface, #ffffff); }
  .band { fill: var(--surface-2, #eef1ef); }
  .acc { fill: var(--accent, #1a6b63); }
  .amb { fill: var(--amber, #7d5a11); }
  .s0 { fill: var(--s1, #2a78d6); }
  .s1 { fill: var(--s2, #eb6834); }
  .s2 { fill: var(--s3, #1baf7a); }
  .s3 { fill: var(--s4, #eda100); }
  .s4 { fill: var(--s5, #e87ba4); }
  .s5 { fill: var(--s6, #008300); }
  .kink { stroke: var(--ink, #15201f); }
  .kink2 { stroke: var(--ink-2, #4a5654); }
  .kink3 { stroke: var(--ink-3, #6f7b79); }
  .axis { stroke: var(--rule-strong, #c3c9c6); }
  .grid { stroke: var(--rule, #dcdfdd); }
  .kacc { stroke: var(--accent, #1a6b63); }
  .kamb { stroke: var(--amber, #7d5a11); }
  .k0 { stroke: var(--s1, #2a78d6); }
  .k1 { stroke: var(--s2, #eb6834); }
  .k2 { stroke: var(--s3, #1baf7a); }
  .k3 { stroke: var(--s4, #eda100); }
  .k4 { stroke: var(--s5, #e87ba4); }
  .k5 { stroke: var(--s6, #008300); }
  .ksurf { stroke: var(--surface, #ffffff); }
</style>
<rect class="s0" x="78.0" y="12.0" width="12.0" height="12.0" fill="#2a78d6" rx="2"/>
<text class="ink2" x="95.0" y="22.0" font-size="12" font-weight="500" text-anchor="start" fill="#4a5654">Would recommend</text>
<rect class="s1" x="217.8" y="12.0" width="12.0" height="12.0" fill="#eb6834" rx="2"/>
<text class="ink2" x="234.8" y="22.0" font-size="12" font-weight="500" text-anchor="start" fill="#4a5654">Would not</text>
<line class="axis" x1="74.0" y1="276.0" x2="78.0" y2="276.0" stroke="#c3c9c6" stroke-width="1" fill="none"/>
<text class="ink3" x="70.0" y="280.0" font-size="11" font-weight="400" text-anchor="end" fill="#6f7b79">0%</text>
<line class="axis" x1="74.0" y1="229.6" x2="78.0" y2="229.6" stroke="#c3c9c6" stroke-width="1" fill="none"/>
<text class="ink3" x="70.0" y="233.6" font-size="11" font-weight="400" text-anchor="end" fill="#6f7b79">20%</text>
<line class="axis" x1="74.0" y1="183.2" x2="78.0" y2="183.2" stroke="#c3c9c6" stroke-width="1" fill="none"/>
<text class="ink3" x="70.0" y="187.2" font-size="11" font-weight="400" text-anchor="end" fill="#6f7b79">40%</text>
<line class="axis" x1="74.0" y1="136.8" x2="78.0" y2="136.8" stroke="#c3c9c6" stroke-width="1" fill="none"/>
<text class="ink3" x="70.0" y="140.8" font-size="11" font-weight="400" text-anchor="end" fill="#6f7b79">60%</text>
<line class="axis" x1="74.0" y1="90.4" x2="78.0" y2="90.4" stroke="#c3c9c6" stroke-width="1" fill="none"/>
<text class="ink3" x="70.0" y="94.4" font-size="11" font-weight="400" text-anchor="end" fill="#6f7b79">80%</text>
<line class="axis" x1="74.0" y1="44.0" x2="78.0" y2="44.0" stroke="#c3c9c6" stroke-width="1" fill="none"/>
<text class="ink3" x="70.0" y="48.0" font-size="11" font-weight="400" text-anchor="end" fill="#6f7b79">100%</text>
