<text class="ink" x="720.6" y="310.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#15201f">Hillcrest</text>
<text class="ink3" x="78.0" y="352.0" font-size="11" font-weight="400" text-anchor="start" fill="#6f7b79">Column width: the hospital&#x27;s share of the 300 patients; segment height: percentage of that hospital&#x27;s patients</text>
</svg>
