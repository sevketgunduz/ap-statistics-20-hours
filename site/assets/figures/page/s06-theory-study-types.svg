<svg viewBox="0 0 760 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decision tree for the type of a study. Were treatments imposed on the units? Yes: an experiment, with treatments assigned to experimental units. No: an observational study, where values are recorded. Observational studies include surveys, prospective studies and retrospective studies." font-family="Public Sans, system-ui, sans-serif">
<style>
  .ink { fill: var(--ink, #15201f); }
  .ink2 { fill: var(--ink-2, #4a5654); }
  .ink3 { fill: var(--ink-3, #6f7b79); }
  .kink { stroke: var(--ink, #15201f); }
  .kink2 { stroke: var(--ink-2, #4a5654); }
  .kink3 { stroke: var(--ink-3, #6f7b79); }
  .axis { stroke: var(--rule-strong, #c3c9c6); }
  .grid { stroke: var(--rule, #dcdfdd); }
  .surf { fill: var(--surface, #ffffff); }
  .band { fill: var(--surface-2, #eef1ef); }
  .acc { fill: var(--accent, #1a6b63); }
  .kacc { stroke: var(--accent, #1a6b63); }
  .amb { fill: var(--amber, #7d5a11); }
  .kamb { stroke: var(--amber, #7d5a11); }
  .s0 { fill: var(--s1, #2a78d6); }
  .k0 { stroke: var(--s1, #2a78d6); }
  .s1 { fill: var(--s2, #eb6834); }
  .k1 { stroke: var(--s2, #eb6834); }
  .s2 { fill: var(--s3, #1baf7a); }
  .k2 { stroke: var(--s3, #1baf7a); }
  .s3 { fill: var(--s4, #eda100); }
  .k3 { stroke: var(--s4, #eda100); }
  .s4 { fill: var(--s5, #e87ba4); }
  .k4 { stroke: var(--s5, #e87ba4); }
  .s5 { fill: var(--s6, #008300); }
  .k5 { stroke: var(--s6, #008300); }
</style>
<rect class="band kink3" x="250.0" y="10.0" width="260.0" height="50.0" rx="4" fill="#eef1ef" stroke="#6f7b79" stroke-width="1.4"/>
<text class="ink" x="380.0" y="31.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#15201f">A statistical study</text>
<text class="ink2" x="380.0" y="50.0" font-size="12" font-weight="400" text-anchor="middle" fill="#4a5654">Did the researcher impose treatments?</text>
<line class="kink3" x1="380.0" y1="60.0" x2="380.0" y2="78.0" stroke="#6f7b79" stroke-width="1.4" fill="none"/>
<line class="kink3" x1="150.0" y1="78.0" x2="610.0" y2="78.0" stroke="#6f7b79" stroke-width="1.4" fill="none"/>
<line class="kink2" x1="150.0" y1="78.0" x2="150.0" y2="103.0" stroke="#4a5654" stroke-width="1.5" fill="none"/>
<polygon class="ink2" points="150.0,112.0 145.9,103.0 154.1,103.0" fill="#4a5654" stroke="none"/>
<line class="kink2" x1="610.0" y1="78.0" x2="610.0" y2="103.0" stroke="#4a5654" stroke-width="1.5" fill="none"/>
<polygon class="ink2" points="610.0,112.0 606.0,103.0 614.0,103.0" fill="#4a5654" stroke="none"/>
<rect class="surf" x="106.0" y="84.0" width="38.0" height="20.0" rx="3" fill="#ffffff" stroke="none" stroke-width="1.2"/>
<rect class="surf" x="616.0" y="84.0" width="30.0" height="20.0" rx="3" fill="#ffffff" stroke="none" stroke-width="1.2"/>
<text class="ink2" x="140.0" y="98.0" font-size="12" font-weight="600" text-anchor="end" fill="#4a5654">yes</text>
<text class="ink2" x="620.0" y="98.0" font-size="12" font-weight="600" text-anchor="start" fill="#4a5654">no</text>
<rect class="surf kink3" x="20.0" y="114.0" width="260.0" height="88.0" rx="4" fill="#ffffff" stroke="#6f7b79" stroke-width="1.4"/>
<text class="acc" x="32.0" y="135.0" font-size="11.5" font-weight="600" text-anchor="start" fill="#1a6b63" font-family="IBM Plex Mono, monospace">EXPERIMENT</text>
<text class="ink2" x="32.0" y="155.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">treatments are assigned to</text>
<text class="ink2" x="32.0" y="172.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">experimental units, then a</text>
<text class="ink2" x="32.0" y="189.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">response is measured</text>
<rect class="surf kink3" x="480.0" y="114.0" width="260.0" height="88.0" rx="4" fill="#ffffff" stroke="#6f7b79" stroke-width="1.4"/>
<text class="acc" x="492.0" y="135.0" font-size="11.5" font-weight="600" text-anchor="start" fill="#1a6b63" font-family="IBM Plex Mono, monospace">OBSERVATIONAL STUDY</text>
<text class="ink2" x="492.0" y="155.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">nothing is imposed: the</text>
<text class="ink2" x="492.0" y="172.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">values of the variables</text>
<text class="ink2" x="492.0" y="189.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">are recorded</text>
<line class="kink3" x1="610.0" y1="202.0" x2="610.0" y2="222.0" stroke="#6f7b79" stroke-width="1.4" fill="none"/>
<line class="kink3" x1="375.0" y1="222.0" x2="686.0" y2="222.0" stroke="#6f7b79" stroke-width="1.4" fill="none"/>
<line class="kink2" x1="375.0" y1="222.0" x2="375.0" y2="236.0" stroke="#4a5654" stroke-width="1.5" fill="none"/>
<polygon class="ink2" points="375.0,245.0 370.9,236.0 379.1,236.0" fill="#4a5654" stroke="none"/>
<line class="kink2" x1="535.0" y1="222.0" x2="535.0" y2="236.0" stroke="#4a5654" stroke-width="1.5" fill="none"/>
<polygon class="ink2" points="535.0,245.0 531.0,236.0 539.0,236.0" fill="#4a5654" stroke="none"/>
<line class="kink2" x1="686.0" y1="222.0" x2="686.0" y2="236.0" stroke="#4a5654" stroke-width="1.5" fill="none"/>
<polygon class="ink2" points="686.0,245.0 682.0,236.0 690.0,236.0" fill="#4a5654" stroke="none"/>
<rect class="surf kink3" x="300.0" y="246.0" width="150.0" height="92.0" rx="4" fill="#ffffff" stroke="#6f7b79" stroke-width="1.4"/>
<text class="acc" x="312.0" y="267.0" font-size="11.5" font-weight="600" text-anchor="start" fill="#1a6b63" font-family="IBM Plex Mono, monospace">SURVEY</text>
<text class="ink2" x="312.0" y="287.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">standard questions</text>
<text class="ink2" x="312.0" y="304.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">to people</text>
<rect class="surf kink3" x="460.0" y="246.0" width="150.0" height="92.0" rx="4" fill="#ffffff" stroke="#6f7b79" stroke-width="1.4"/>
<text class="acc" x="472.0" y="267.0" font-size="11.5" font-weight="600" text-anchor="start" fill="#1a6b63" font-family="IBM Plex Mono, monospace">PROSPECTIVE</text>
<text class="ink2" x="472.0" y="287.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">select units now;</text>
<text class="ink2" x="472.0" y="304.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">gather data now</text>
<text class="ink2" x="472.0" y="321.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">and into the future</text>
<rect class="surf kink3" x="620.0" y="246.0" width="132.0" height="92.0" rx="4" fill="#ffffff" stroke="#6f7b79" stroke-width="1.4"/>
<text class="acc" x="632.0" y="267.0" font-size="11.5" font-weight="600" text-anchor="start" fill="#1a6b63" font-family="IBM Plex Mono, monospace">RETROSPECTIVE</text>
<text class="ink2" x="632.0" y="287.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">select units now;</text>
<text class="ink2" x="632.0" y="304.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">gather data from</text>
<text class="ink2" x="632.0" y="321.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">the past</text>
<rect class="band" x="20.0" y="214.0" width="260.0" height="104.0" rx="4" fill="#eef1ef" stroke="none" stroke-width="1.2"/>
<text class="ink2" x="32.0" y="236.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">With random assignment of treatments, an</text>
<text class="ink2" x="32.0" y="254.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">experiment can support a cause-and-effect</text>
<text class="ink2" x="32.0" y="272.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">conclusion (1.10.A.3). An observational</text>
<text class="ink2" x="32.0" y="290.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">study cannot rule out a confounding</text>
<text class="ink2" x="32.0" y="308.0" font-size="12" font-weight="400" text-anchor="start" fill="#4a5654">variable (1.10.D.5).</text>
</svg>
