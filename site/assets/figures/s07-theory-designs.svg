<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three experimental designs for 20 units and two treatments, A and B. Completely randomized: all 20 units are randomly assigned, 10 to A and 10 to B, and the responses are compared. Randomized block: the units are first grouped into blocks by a blocking variable, 12 in block 1 and 8 in block 2, then treatments are randomly assigned within each block, and treatments are compared within each block. Matched pairs: 10 pairs matched on an extraneous variable; in each pair one unit is randomly given A and the other B, or each unit gets both treatments in a random order." font-family="Public Sans, system-ui, sans-serif">
